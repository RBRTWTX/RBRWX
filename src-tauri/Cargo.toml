[package]
name = "rbr-wx"
version = "0.1.0"
description = "RBR WX local broadcast weather workstation"
authors = ["RBR WX"]
edition = "2021"

[lib]
name = "rbr_wx_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
tauri = { version = "=2.11.5", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
